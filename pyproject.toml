[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qa-screenshot-tool"
version = "0.1.0"
requires-python = ">=3.12"
# Exact pins: a fresh install with open ranges pulls sqlmodel>=0.0.4x +
# SQLAlchemy 2.1, which reject the naive datetime.utcnow() values the models
# use (500 on every insert). sqlalchemy/pydantic are transitive but pinned too.
dependencies = [
    "fastapi==0.137.1",
    "uvicorn[standard]==0.49.0",
    "sqlmodel==0.0.38",
    "sqlalchemy==2.0.51",
    "pydantic==2.13.4",
    "asyncpg==0.31.0",
    "alembic==1.18.4",
    "arq==0.28.0",
    "redis==5.3.1",
    "playwright==1.58.0",
    "httpx==0.28.1",
    "lxml==6.1.1",
    "defusedxml==0.7.1",
    "python-jose[cryptography]==3.5.0",
    "passlib[bcrypt]==1.7.4",
    "pydantic-settings==2.14.1",
    "python-multipart==0.0.32",
    "aiosmtplib==5.1.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "RUF", # ruff-specific
]
ignore = [
    "B008", # do not perform function calls in default arguments (FastAPI Depends pattern)
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
