services:
  api:
    volumes:
      - app_data:/app/data
    restart: unless-stopped

  worker:
    restart: unless-stopped
    volumes:
      - app_data:/app/data

  frontend:
    ports:
      - "${PROD_HTTP_PORT:-80}:80"
    restart: unless-stopped

  migrate:
    build:
      context: .
    command: alembic upgrade head
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  db:
    restart: unless-stopped

  redis:
    restart: unless-stopped

volumes:
  app_data:
